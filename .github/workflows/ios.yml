# Compila la app de iOS (mobile/) en un Mac de GitHub y publica un .ipa sin firmar para instalarlo con ESign.
name: App iOS

on:
  push:
    branches: [main, master]
    paths:
      - 'mobile/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Versión de Flutter (vacío = última estable)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Versión de Xcode
        run: xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ github.event.inputs.flutter_version }}
          cache: true

      - name: Generar la carpeta de iOS
        run: |
          if [ ! -d ios ]; then
            flutter create --platforms=ios --org com.ondsc --project-name trevix .
            rm -rf test
          fi

      - name: Dependencias
        run: flutter pub get

      - name: Icono de la app
        run: dart run flutter_launcher_icons

      - name: Configurar Info.plist, iOS mínimo y orientación
        run: |
          PLIST=ios/Runner/Info.plist
          pb() { /usr/libexec/PlistBuddy -c "$1" "$PLIST" 2>/dev/null || true; }
          set_key() {
            /usr/libexec/PlistBuddy -c "Set :$1 $3" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :$1 $2 $3" "$PLIST"
          }
          set_key CFBundleDisplayName string "TREVIX"
          set_key CFBundleName string "TREVIX"
          set_key NSPhotoLibraryUsageDescription string "TREVIX usa tus fotos y videos para publicarlos, crear historias y enviarlos por mensaje."
          set_key NSPhotoLibraryAddUsageDescription string "TREVIX guarda en tu galería las imágenes que decidas descargar."
          set_key NSCameraUsageDescription string "TREVIX usa la cámara para tomar fotos y videos para tus publicaciones e historias."
          set_key NSMicrophoneUsageDescription string "TREVIX usa el micrófono para grabar notas de voz en tus chats y el sonido de tus videos."
          set_key NSLocationWhenInUseUsageDescription string "TREVIX usa tu ubicación, solo mientras usas la app y cuando tú lo eliges, para añadir el lugar a tus publicaciones e historias y completar el país de tu perfil."
          set_key NSContactsUsageDescription string "TREVIX lee tus contactos en el teléfono para que puedas invitarlos por SMS. No se suben a nuestros servidores."
          set_key ITSAppUsesNonExemptEncryption bool false
          set_key UIStatusBarStyle string UIStatusBarStyleLightContent
          set_key FlutterDeepLinkingEnabled bool true
          pb "Delete :UISupportedInterfaceOrientations"
          pb "Add :UISupportedInterfaceOrientations array"
          pb "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait"
          # Enlaces trevix://open/post.php?id=5 (botón «Abrir en la app» de la web).
          pb "Delete :CFBundleURLTypes"
          pb "Add :CFBundleURLTypes array"
          pb "Add :CFBundleURLTypes:0 dict"
          pb "Add :CFBundleURLTypes:0:CFBundleURLName string com.ondsc.trevix"
          pb "Add :CFBundleURLTypes:0:CFBundleURLSchemes array"
          pb "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string trevix"
          # Apps a las que se comparte directamente.
          pb "Delete :LSApplicationQueriesSchemes"
          pb "Add :LSApplicationQueriesSchemes array"
          i=0
          for s in twitter whatsapp tg snssdk1233 tiktok fb sms mailto; do
            pb "Add :LSApplicationQueriesSchemes:$i string $s"; i=$((i+1))
          done
          # Avisos en segundo plano (Actualización en segundo plano / BGAppRefreshTask).
          pb "Delete :UIBackgroundModes"
          pb "Add :UIBackgroundModes array"
          pb "Add :UIBackgroundModes:0 string fetch"
          pb "Add :UIBackgroundModes:1 string processing"
          pb "Delete :BGTaskSchedulerPermittedIdentifiers"
          pb "Add :BGTaskSchedulerPermittedIdentifiers array"
          pb "Add :BGTaskSchedulerPermittedIdentifiers:0 string com.ondsc.trevix.avisos"
          plutil -lint "$PLIST"
          # iOS 14 como mínimo (miniaturas de video con fc_native_video_thumbnail); todo iPhone con iOS 13 puede actualizar.
          [ -f ios/Podfile ] || flutter build ios --config-only --release --no-codesign
          sed -i '' -E "s/^#? *platform :ios.*/platform :ios, '14.0'/" ios/Podfile
          grep -q "^platform :ios, '14.0'" ios/Podfile
          sed -i '' -E 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9]+\.[0-9]+;/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Notificaciones con la app abierta y en segundo plano
        run: |
          APPD=ios/Runner/AppDelegate.swift
          if ! grep -q UNUserNotificationCenter "$APPD"; then
            perl -0pi -e 's/^import Flutter\n/import Flutter\nimport UserNotifications\n/m' "$APPD"
            perl -0pi -e 's/\n([ \t]*)return super\.application\(application, didFinishLaunchingWithOptions/\n${1}UNUserNotificationCenter.current().delegate = self as? UNUserNotificationCenterDelegate\n${1}return super.application(application, didFinishLaunchingWithOptions/' "$APPD"
          fi
          # BGTaskScheduler exige registrar la tarea antes de terminar el arranque (con UIScene los plugins se registran después).
          if ! grep -q WorkmanagerPlugin "$APPD"; then
            perl -0pi -e 's/^import Flutter\n/import Flutter\nimport workmanager_apple\n/m' "$APPD"
            perl -0pi -e 's/\n([ \t]*)return super\.application\(application, didFinishLaunchingWithOptions/\n${1}WorkmanagerPlugin.registerLaunchHandlers()\n${1}WorkmanagerPlugin.setPluginRegistrantCallback { registry in GeneratedPluginRegistrant.register(with: registry) }\n${1}WorkmanagerPlugin.registerPeriodicTask(withIdentifier: "com.ondsc.trevix.avisos", earliestBeginInSeconds: NSNumber(value: 15 * 60))\n${1}return super.application(application, didFinishLaunchingWithOptions/' "$APPD"
          fi
          grep -q UNUserNotificationCenter "$APPD" || { echo "No se pudo ajustar AppDelegate.swift"; exit 1; }
          grep -q 'registerPeriodicTask(withIdentifier: "com.ondsc.trevix.avisos"' "$APPD" || { echo "No se pudo registrar la tarea en segundo plano"; exit 1; }
          cat "$APPD"

      - name: Revisar el código
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Compilar (sin firmar)
        run: flutter build ios --release --no-codesign

      - name: Probar en el simulador de iPhone (arranque y pruebas de integración)
        timeout-minutes: 40
        run: |
          set +e
          mkdir -p smoke
          touch smoke/.inicio
          crash_reports() {
            sleep 20
            find ~/Library/Logs/DiagnosticReports "$HOME/Library/Developer/CoreSimulator/Devices/$UDID/data/Library/Logs/CrashReporter" \
              \( -name 'Runner*' -o -name '*.ips' -o -name '*.crash' \) -newer smoke/.inicio -exec cp {} smoke/ \; 2>/dev/null
            for f in smoke/*.ips smoke/*.crash smoke/Runner*; do [ -f "$f" ] && { echo "=== $f"; head -c 12000 "$f"; echo; }; done
            [ -n "$UDID" ] && xcrun simctl spawn "$UDID" log show --last 10m --style compact \
              --predicate 'process == "Runner" AND (messageType == error OR messageType == fault OR eventMessage CONTAINS[c] "terminat" OR eventMessage CONTAINS[c] "crash" OR eventMessage CONTAINS[c] "exception")' \
              > smoke/registro-runner.txt 2>&1
            [ -n "$UDID" ] && xcrun simctl spawn "$UDID" log show --last 10m --style compact \
              --predicate 'eventMessage CONTAINS "com.ondsc.trevix" AND (process == "SpringBoard" OR process == "runningboardd" OR process == "launchd")' \
              > smoke/registro-sistema.txt 2>&1
            tail -n 60 smoke/registro-runner.txt smoke/registro-sistema.txt 2>/dev/null
          }
          flutter build ios --simulator --debug || flutter build ios --simulator --debug || exit 1
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          print(next(d['udid'] for runtime, items in devices.items() if 'iOS' in runtime for d in items if d['name'].startswith('iPhone')))")
          echo "Simulador: $UDID"
          trap 'xcrun simctl shutdown all || true' EXIT
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$UDID" com.ondsc.trevix
          sleep 30
          xcrun simctl io "$UDID" screenshot smoke/abierta.png
          if ! xcrun simctl spawn "$UDID" launchctl list | grep -q "com.ondsc.trevix"; then
            echo "::error::La app se cerró al abrir en el simulador."
            crash_reports
            exit 1
          fi
          echo "La app sigue abierta después de 30 s."
          xcrun simctl terminate "$UDID" com.ondsc.trevix
          # A veces flutter test no logra conectarse a la app en el simulador («Unable to start the app on the device»):
          # eso es del entorno, no de la app, así que se reintenta y cada intento tiene un tope de 12 minutos.
          for attempt in 1 2; do
            perl -e 'alarm shift; exec @ARGV' 720 flutter test integration_test -d "$UDID" --reporter expanded 2>&1 | tee smoke/pruebas.txt
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ]; then break; fi
            if grep -q -e 'All tests passed' smoke/pruebas.txt; then status=0; break; fi
            if grep -q -E 'Unable to start the app|debug connection|log reader failed' smoke/pruebas.txt || [ "$status" -eq 142 ]; then
              infra=1
              echo "::warning::El simulador no arrancó la prueba (intento $attempt)."
              xcrun simctl terminate "$UDID" com.ondsc.trevix 2>/dev/null
              continue
            fi
            infra=0
            break
          done
          crash_reports
          if [ "$status" -ne 0 ] && [ "${infra:-0}" -eq 1 ]; then
            echo "::warning::No se pudieron ejecutar las pruebas de integración por el simulador; la app sí abrió y siguió abierta."
          elif [ "$status" -ne 0 ]; then
            echo "::error::Fallaron las pruebas de integración (ver smoke/pruebas.txt e informes de cierre)."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prueba-simulador-${{ github.run_number }}
          path: mobile/smoke/
          if-no-files-found: ignore
          retention-days: 14

      - name: Empaquetar .ipa
        run: |
          rm -rf Payload TREVIX.ipa
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry TREVIX.ipa Payload
          ls -lh TREVIX.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: TREVIX-ios-${{ github.run_number }}
          path: mobile/TREVIX.ipa
          retention-days: 30

      - name: Publicar en Releases (descarga directa desde el iPhone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build-${{ github.run_number }}
          name: TREVIX iOS · compilación ${{ github.run_number }}
          prerelease: true
          files: mobile/TREVIX.ipa
          body: |
            .ipa sin firmar para instalar con ESign (u otra herramienta de firma).
            Ábrelo desde el iPhone → «Abrir con ESign» → Firmar → Instalar.
