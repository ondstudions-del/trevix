# Genera trevix-release.jks desde el secreto del repo (solo el dueño del repo puede ejecutarlo).
# Descarga el artefacto del run y bórralo del PC cuando ya tengas copia de respaldo.
name: Exportar keystore Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Escribir trevix-release.jks
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASS" ]; then
            echo "::error::Faltan ANDROID_KEYSTORE_B64 o ANDROID_KEYSTORE_PASSWORD"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > trevix-release.jks
          test -s trevix-release.jks
          keytool -list -keystore trevix-release.jks -storepass "$STORE_PASS" -alias trevix > /dev/null

      - name: Instrucciones locales (sin contraseña en el log)
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          umask 077
          cat > instrucciones-firma-local.txt <<EOF
          Copia trevix-release.jks a: C:\\Users\\USER\\dev\\trevix-release.jks
          Variables de usuario Windows:
            TREVIX_KEYSTORE=C:\\Users\\USER\\dev\\trevix-release.jks
            TREVIX_KEYSTORE_PASSWORD=<ver archivo contrasena-firma-android.txt en el mismo artefacto>
          Alias de la clave: trevix
          Borra estos txt cuando termines.
          EOF
          printf '%s\n' "$STORE_PASS" > contrasena-firma-android.txt

      - uses: actions/upload-artifact@v4
        with:
          name: trevix-keystore-export
          path: |
            trevix-release.jks
            instrucciones-firma-local.txt
            contrasena-firma-android.txt
          retention-days: 1
          if-no-files-found: error