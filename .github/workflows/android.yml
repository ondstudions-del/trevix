# Compila la app de Android (mobile/, el mismo código que la de iOS) en Ubuntu, la prueba en un emulador y publica
# un APK firmado con la clave de TREVIX (secretos ANDROID_KEYSTORE_B64 y ANDROID_KEYSTORE_PASSWORD).
name: App Android

on:
  push:
    branches: [main, master]
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Versión de Flutter (vacío = última estable)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    env:
      TREVIX_KEYSTORE: ${{ github.workspace }}/mobile/trevix-release.jks
      TREVIX_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Liberar espacio en el runner
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          df -h / | tail -1
          free -h | head -2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ github.event.inputs.flutter_version }}
          cache: true

      - name: Clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$TREVIX_KEYSTORE_PASSWORD" ]; then
            echo "::error::Faltan los secretos ANDROID_KEYSTORE_B64 y ANDROID_KEYSTORE_PASSWORD."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$TREVIX_KEYSTORE"
          keytool -list -keystore "$TREVIX_KEYSTORE" -storepass "$TREVIX_KEYSTORE_PASSWORD" -alias trevix | grep -i "SHA-256\|SHA256" || true

      - name: Generar la carpeta de Android
        run: |
          flutter create --platforms=android --org com.ondsc --project-name trevix .
          rm -rf test
          cp -R android_overrides/app/. android/app/
          python3 android_overrides/configure_gradle.py
          cat android/app/src/main/AndroidManifest.xml | head -5

      - name: Dependencias
        run: flutter pub get

      - name: Icono de la app
        run: dart run flutter_launcher_icons -f flutter_launcher_icons_android.yaml

      - name: Revisar el código
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Compilar el APK firmado
        run: |
          ( while sleep 60; do echo "--- $(date +%T) $(free -m | awk '/Mem/ {print "memoria usada " $3 " de " $2 " MB"}') · disco libre $(df -h / | awk 'NR==2 {print $4}')"; done ) &
          monitor=$!
          flutter build apk --release --build-number=${{ github.run_number }}
          status=$?
          kill $monitor
          [ $status -eq 0 ] || exit $status
          cp build/app/outputs/flutter-apk/app-release.apk TREVIX.apk
          ls -lh TREVIX.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs TREVIX.apk | head -5

      - name: Activar KVM para el emulador
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Probar en el emulador de Android (arranque y pruebas de integración)
        timeout-minutes: 40
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: mobile
          script: bash ../.github/scripts/android-emulator-test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prueba-emulador-${{ github.run_number }}
          path: mobile/smoke/
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: TREVIX-android-${{ github.run_number }}
          path: mobile/TREVIX.apk
          retention-days: 30

      - name: Publicar en Releases (descarga directa desde el teléfono)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: TREVIX Android · compilación ${{ github.run_number }}
          prerelease: true
          files: mobile/TREVIX.apk
          body: |
            APK firmado de TREVIX para Android 6.0 o superior.
            Descárgalo en el teléfono, ábrelo y permite «Instalar apps desconocidas» si Android lo pide.
            Las compilaciones nuevas se instalan encima de la anterior sin perder la sesión.
