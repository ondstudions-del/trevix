<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#09090B"/>
      <stop offset=".6" stop-color="#2e1065"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <pattern id="win" width="26" height="34" patternUnits="userSpaceOnUse">
      <rect x="7" y="9" width="9" height="12" rx="1" fill="#A78BFA" opacity=".55"/>
    </pattern>
    <pattern id="win2" width="22" height="28" patternUnits="userSpaceOnUse">
      <rect x="6" y="8" width="7" height="10" rx="1" fill="#60A5FA" opacity=".5"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="35"/></filter>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#09090B"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#sky)"/>
  <ellipse cx="600" cy="720" rx="600" ry="160" fill="#7C3AED" filter="url(#glow)" opacity=".55"/>
  <g fill="#120c26">
    <rect x="30" y="420" width="120" height="400"/>
    <rect x="170" y="300" width="100" height="520"/>
    <rect x="290" y="380" width="140" height="440"/>
    <rect x="450" y="200" width="110" height="620"/>
    <rect x="580" y="330" width="130" height="490"/>
    <rect x="730" y="250" width="100" height="570"/>
    <rect x="850" y="400" width="150" height="420"/>
    <rect x="1020" y="320" width="140" height="500"/>
  </g>
  <g>
    <rect x="30" y="420" width="120" height="400" fill="url(#win2)"/>
    <rect x="170" y="300" width="100" height="520" fill="url(#win)"/>
    <rect x="290" y="380" width="140" height="440" fill="url(#win2)"/>
    <rect x="450" y="200" width="110" height="620" fill="url(#win)"/>
    <rect x="580" y="330" width="130" height="490" fill="url(#win2)"/>
    <rect x="730" y="250" width="100" height="570" fill="url(#win)"/>
    <rect x="850" y="400" width="150" height="420" fill="url(#win2)"/>
    <rect x="1020" y="320" width="140" height="500" fill="url(#win)"/>
  </g>
  <line x1="505" y1="200" x2="505" y2="120" stroke="#C4B5FD" stroke-width="4"/>
  <circle cx="505" cy="116" r="7" fill="#F0ABFC"/>
  <rect y="800" width="1200" height="100" fill="url(#road)"/>
  <rect y="798" width="1200" height="3" fill="#A78BFA" opacity=".7"/>
</svg>
