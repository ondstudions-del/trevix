name: trevix
description: TREVIX para iOS y Android — Conecta. Comparte. Descubre.
publish_to: 'none'
# Alpha 1.3 = 1.3.0 (AppConfig.version en lib/core/config.dart). El número tras «+» es el de compilación.
version: 1.6.0+27

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  file_picker: ^10.3.3
  video_player: ^2.9.2
  # 3.0.1 fija: la 4.x exige iOS 16 y la app funciona desde iOS 14.
  fc_native_video_thumbnail: 3.0.1
  just_audio: ^0.9.42
  audio_session: ^0.1.21
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.16
  path_provider: ^2.1.5
  record: ^6.0.0
  flutter_local_notifications: ^18.0.1
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  flutter_contacts: ^2.6.0
  gal: ^2.3.1
  workmanager: ^0.10.10
  # Cifrado de extremo a extremo de los chats (X25519, AES-GCM, HKDF y PBKDF2 en Dart puro).
  cryptography: ^2.7.0
  screen_protector: ^1.5.3
  # Navegador integrado: los enlaces externos se abren dentro de la app (WKWebView en iOS, WebView en Android).
  webview_flutter: ^4.14.1
  in_app_purchase: ^3.3.1
  camera: ^0.12.2
  photo_manager: ^3.12.0
  # Edición de video en el teléfono (recorte 4:5, efectos de cara, marca de agua y cierre al descargar).
  trevix_video:
    path: packages/trevix_video
  # Avisos push en iPhone con Firebase Cloud Messaging y APNs (en Android están en android_overrides).
  trevix_fcm:
    path: packages/trevix_fcm
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/audio/

# iOS; Android usa flutter_launcher_icons_android.yaml (icono adaptable).
flutter_launcher_icons:
  ios: true
  android: false
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
