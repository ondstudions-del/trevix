# Icono de Android (dart run flutter_launcher_icons -f flutter_launcher_icons_android.yaml).
# Icono adaptable: el # blanco sobre el degradado de la marca, y versión monocroma para los iconos temáticos.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  min_sdk_android: 23
  adaptive_icon_background: assets/icon/background.png
  adaptive_icon_foreground: assets/icon/foreground.png
  adaptive_icon_monochrome: assets/icon/foreground.png
