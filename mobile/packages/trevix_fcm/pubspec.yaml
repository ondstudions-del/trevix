name: trevix_fcm
description: Avisos push de TREVIX en iPhone con Firebase Cloud Messaging y APNs (Android lo hace en android_overrides).
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: TrevixFcmPlugin
