name: trevix_app_icon
description: Canal nativo para cambiar el icono de la app (iOS alternate icons).
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: TrevixAppIconPlugin
      android:
        package: com.ondsc.trevix_app_icon
        pluginClass: TrevixAppIconPlugin

dependencies:
  flutter:
    sdk: flutter
