group = "com.ondsc.trevix.video"
version = "1.0"

apply plugin: "com.android.library"

android {
    namespace = "com.ondsc.trevix.video"
    compileSdk = 36

    defaultConfig {
        minSdk = 23
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    // Media3 alinea todos sus módulos a la versión más alta de la app (video_player_android trae 1.9.2): compilar
    // contra otra deja llamadas a métodos que en el teléfono ya no existen y la app se cierra al editar.
    implementation "androidx.media3:media3-transformer:1.9.2"
    implementation "androidx.media3:media3-effect:1.9.2"
    implementation "androidx.media3:media3-common:1.9.2"
}
